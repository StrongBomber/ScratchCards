name: Otomatik APK Derle (Scritchy Scratchy Watch)

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
  workflow_dispatch:

# Galaxy Watch 8 için otomatik APK derlemesi - Scritchy Scratchy birebir klon
# Wear OS 6 (API 34) - 480x480 yuvarlak ekran optimize

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Wrapper hazırla
        run: |
          chmod +x ./gradlew
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then gradle wrapper --gradle-version 8.7; fi
          ls -lh gradle/wrapper/

      - name: APK derle
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: APK'leri yükle
        uses: actions/upload-artifact@v4
        with:
          name: ScritchyScratchy-GalaxyWatch8-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
