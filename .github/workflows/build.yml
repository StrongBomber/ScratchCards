name: Build Galaxy Watch 8 APK

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android platforms
        run: |
          sdkmanager --version
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}-${{ runner.os }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Generate Wrapper Jar if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Wrapper jar missing - generating via gradle wrapper"
            gradle wrapper --gradle-version 8.7
            ls -lh gradle/wrapper/
          else
            echo "Wrapper jar exists"
            ls -lh gradle/wrapper/
          fi

      - name: Build Debug APK (Galaxy Watch 8 - Wear OS 6 - 480x480)
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
          EXIT=${PIPESTATUS[0]}
          echo "EXIT=$EXIT" >> build.log
          if [ $EXIT -ne 0 ]; then
            echo "Build failed, saving log"
            mkdir -p logs
            cp build.log logs/build-debug.log
            cat build.log | tail -n 400
          fi
          exit $EXIT

      - name: Save build log on failure
        if: failure()
        run: |
          mkdir -p logs
          cp build.log logs/build-debug.log || true
          cat build.log | tail -n 800 || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f logs/build-debug.log || true
          git commit -m "ci: build log [skip ci]" || true
          git push origin HEAD:arena/01a0cf4f-scratchcards || true

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: List APKs
        run: |
          find app/build/outputs -type f -name "*.apk" | xargs ls -lh || true
          echo "--- APK details ---"
          for f in $(find app/build/outputs -name "*.apk"); do echo "=== $f ==="; aapt dump badging "$f" 2>&1 | head -n 20 || true; done

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ScritchyScratchy-Watch-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ScritchyScratchy-Watch-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Prepare APK for direct download (apk/ folder)
        if: github.ref == 'refs/heads/arena/01a0cf4f-scratchcards' || github.ref == 'refs/heads/main'
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/*.apk apk/ScritchyScratchy-GalaxyWatch8-debug.apk || true
          cp app/build/outputs/apk/release/*.apk apk/ScritchyScratchy-GalaxyWatch8-release.apk || true
          ls -lh apk/
          echo "APK hazır - doğrudan indirme için apk/ + Release"

      - name: Commit APK to repo (direct raw download)
        if: github.ref == 'refs/heads/arena/01a0cf4f-scratchcards'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f apk/*.apk || true
          git commit -m "chore: update APK for direct download [skip ci]" || echo "no APK changes"
          git push origin HEAD:arena/01a0cf4f-scratchcards || true

      - name: Create/Update Latest Release (direct .apk download)
        if: github.ref == 'refs/heads/arena/01a0cf4f-scratchcards' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: watch-latest
          name: "Galaxy Watch 8 - Scritchy Scratchy Latest APK"
          body: |
            Scritchy Scratchy — Galaxy Watch 8 birebir klon (Wear OS 6, 480x480)
            - Otomatik derlenen APK'lar - doğrudan .apk indirin
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}
            Kurulum: adb install ScritchyScratchy-GalaxyWatch8-debug.apk
          files: |
            apk/ScritchyScratchy-GalaxyWatch8-debug.apk
            apk/ScritchyScratchy-GalaxyWatch8-release.apk
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: false
          prerelease: false
          generate_release_notes: true

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
