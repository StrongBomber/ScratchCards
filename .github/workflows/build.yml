name: Build Galaxy Watch 8 APK

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}-${{ runner.os }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Gradle 8.7 (fallback if wrapper jar missing)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Generate Wrapper Jar if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Wrapper jar missing - generating via gradle wrapper"
            gradle wrapper --gradle-version 8.7
            ls -lh gradle/wrapper/
          else
            echo "Wrapper jar exists"
            ls -lh gradle/wrapper/
          fi

      - name: Build Debug APK (Galaxy Watch 8 - Wear OS 6 - 480x480)
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: List APKs
        run: |
          find app/build/outputs -name "*.apk" -type f | xargs ls -lh
          echo "--- APK details ---"
          find app/build/outputs -name "*.apk" -exec sh -c 'echo "=== $1 ==="; aapt dump badging "$1" 2>&1 | head -n 30' _ {} \;

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ScritchyScratchy-Watch-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ScritchyScratchy-Watch-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
